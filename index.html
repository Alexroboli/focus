<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foco - Controle de Tarefas</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <section class="auth-screen" id="authScreen">
      <form class="auth-card" id="authForm">
        <div class="brand auth-brand">
          <div class="brand-mark" aria-hidden="true">F</div>
          <div>
            <strong>Foco</strong>
            <span>acesso protegido</span>
          </div>
        </div>
        <label>
          Senha
          <input id="passwordInput" type="password" placeholder="Digite sua senha" autocomplete="current-password" required />
        </label>
        <p class="auth-error" id="authError" role="alert"></p>
        <button type="submit">
          <i data-lucide="lock-keyhole"></i>
          Entrar
        </button>
      </form>
    </section>

    <div class="app-shell locked" id="appShell">
      <aside class="sidebar" aria-label="Navegacao principal">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">F</div>
          <div>
            <strong>Foco</strong>
            <span>tarefas e projetos</span>
          </div>
        </div>

        <button class="primary-action" id="quickAddBtn" type="button">
          <i data-lucide="plus"></i>
          Nova tarefa
        </button>
        <button class="secondary-action" id="logoutBtn" type="button">
          <i data-lucide="log-out"></i>
          Sair
        </button>

        <nav class="nav-stack" aria-label="Filtros rapidos">
          <button class="nav-item active" type="button" data-filter="inbox">
            <i data-lucide="inbox"></i>
            <span>Entrada</span>
            <b id="countInbox">0</b>
          </button>
          <button class="nav-item" type="button" data-filter="today">
            <i data-lucide="calendar-days"></i>
            <span>Hoje</span>
            <b id="countToday">0</b>
          </button>
          <button class="nav-item" type="button" data-filter="upcoming">
            <i data-lucide="calendar-clock"></i>
            <span>Proximas</span>
            <b id="countUpcoming">0</b>
          </button>
          <button class="nav-item" type="button" data-filter="completed">
            <i data-lucide="check-circle-2"></i>
            <span>Concluidas</span>
            <b id="countCompleted">0</b>
          </button>
        </nav>

        <div class="sidebar-section">
          <div class="section-title">
            <span>Projetos</span>
            <button class="icon-button" id="addProjectBtn" type="button" aria-label="Adicionar projeto">
              <i data-lucide="folder-plus"></i>
            </button>
          </div>
          <div class="project-list" id="projectList"></div>
        </div>

        <div class="sidebar-section compact">
          <div class="section-title"><span>Produtividade</span></div>
          <div class="metric">
            <span id="metricDone">0</span>
            <small>tarefas finalizadas nos ultimos 7 dias</small>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="viewEyebrow">Entrada</p>
            <h1 id="viewTitle">Suas tarefas</h1>
          </div>
          <div class="topbar-actions">
            <div class="searchbox">
              <i data-lucide="search"></i>
              <input id="searchInput" type="search" placeholder="Buscar tarefas, links ou etiquetas" />
            </div>
            <div class="segmented" aria-label="Visualizacao">
              <button class="active" type="button" data-view="list" aria-label="Lista">
                <i data-lucide="list"></i>
              </button>
              <button type="button" data-view="board" aria-label="Painel">
                <i data-lucide="columns-3"></i>
              </button>
              <button type="button" data-view="dates" aria-label="Por data">
                <i data-lucide="calendar-range"></i>
              </button>
            </div>
          </div>
        </header>

        <section class="composer" aria-label="Criar tarefa">
          <form id="taskForm">
            <input id="taskTitle" name="title" type="text" placeholder="Nome da tarefa" required />
            <input id="taskDue" name="due" type="datetime-local" />
            <select id="taskProject" name="project" aria-label="Projeto"></select>
            <select id="taskPriority" name="priority" aria-label="Prioridade">
              <option value="alta">Alta</option>
              <option value="media" selected>Media</option>
              <option value="baixa">Baixa</option>
            </select>
            <label class="dev-toggle">
              <input id="taskIsDev" name="isDev" type="checkbox" />
              <span>Dev</span>
            </label>
            <button type="submit">
              <i data-lucide="send"></i>
              Adicionar
            </button>
          </form>
        </section>

        <section class="filters" aria-label="Filtros de tarefas">
          <button class="chip active" type="button" data-status="all">Todas</button>
          <button class="chip" type="button" data-status="pendente">Pendentes</button>
          <button class="chip" type="button" data-status="andamento">Em andamento</button>
          <button class="chip" type="button" data-status="concluida">Concluidas</button>
          <button class="chip" type="button" data-priority="alta">Prioridade alta</button>
          <button class="chip" type="button" data-niche="dev">Dev</button>
          <button class="chip" type="button" data-date-toggle="true">
            <i data-lucide="calendar-search"></i>
            Data
          </button>
        </section>

        <section class="date-panel hidden" id="datePanel" aria-label="Filtro por periodo">
          <label>
            De
            <input id="filterStartDate" type="date" />
          </label>
          <label>
            Ate
            <input id="filterEndDate" type="date" />
          </label>
          <button class="secondary-action" id="clearDateFilter" type="button">
            <i data-lucide="x"></i>
            Limpar data
          </button>
        </section>

        <section class="content-grid">
          <div class="task-surface">
            <div id="taskList" class="task-list"></div>
            <div id="boardView" class="board-view hidden"></div>
            <div id="dateView" class="date-view hidden"></div>
            <div id="emptyState" class="empty-state hidden">
              <i data-lucide="clipboard-check"></i>
              <strong>Nada por aqui</strong>
              <span>Crie uma tarefa ou ajuste os filtros.</span>
            </div>
          </div>

          <aside class="detail-panel" id="detailPanel" aria-label="Detalhes da tarefa">
            <div class="detail-empty">
              <i data-lucide="mouse-pointer-2"></i>
              <strong>Selecione uma tarefa</strong>
              <span>Detalhes, subtarefas e links aparecem aqui.</span>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <dialog id="projectDialog">
      <form method="dialog" id="projectForm">
        <header>
          <h2>Novo projeto</h2>
          <button class="icon-button" value="cancel" type="submit" aria-label="Fechar">
            <i data-lucide="x"></i>
          </button>
        </header>
        <label>
          Nome
          <input id="projectName" type="text" placeholder="Ex.: Financeiro" required />
        </label>
        <label>
          Cor
          <input id="projectColor" type="color" value="#2f7d6b" />
        </label>
        <menu>
          <button value="cancel" type="submit">Cancelar</button>
          <button id="saveProjectBtn" value="default" type="submit">Salvar</button>
        </menu>
      </form>
    </dialog>
  </body>
</html>
